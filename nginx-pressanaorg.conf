# ============================================================
# Pressana org — exact host (MUST appear before wildcard blocks)
# Proxies to alm-pressana-backend :5003 and alm-pressana-frontend :3003
# SSL paths match alm_nginx mounts on rio-server.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name pressanaorg.rioassetmanagement.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pressanaorg.rioassetmanagement.net;

    ssl_certificate     /etc/nginx/ssl/fullchain-wildcard.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey-wildcard.pem;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://172.17.0.1:5003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    location /api {
        proxy_pass http://172.17.0.1:5003/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://172.17.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
