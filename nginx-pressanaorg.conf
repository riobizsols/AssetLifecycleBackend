# Exact-host Nginx for Pressana org ALM
# Place this BEFORE any server_name *.rioassetmanagement.net block
# so the wildcard tenant stack does not capture pressanaorg.

# HTTP → HTTPS (optional if you terminate TLS elsewhere)
server {
    listen 80;
    listen [::]:80;
    server_name pressanaorg.rioassetmanagement.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pressanaorg.rioassetmanagement.net;

    # Adjust cert paths to match your host / alm_nginx layout
    ssl_certificate     /etc/letsencrypt/live/rioassetmanagement.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rioassetmanagement.net/privkey.pem;

    client_max_body_size 50m;

    # API → Pressana backend container (host port 5003)
    location /api/ {
        proxy_pass http://127.0.0.1:5003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    location /api {
        proxy_pass http://127.0.0.1:5003/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # SPA → Pressana frontend container (host port 3003)
    location / {
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
