# ---------------------------
# PRESSANA ORG ALM
# Exact host — must stay ABOVE "TENANT ALM (apex + wildcard)"
# ---------------------------

server {
    listen 80;
    listen [::]:80;
    server_name pressanaorg.rioassetmanagement.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pressanaorg.rioassetmanagement.net;

    ssl_certificate     /etc/nginx/ssl/fullchain-wildcard.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey-wildcard.pem;

    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://172.17.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api {
        proxy_pass http://172.17.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://172.17.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
