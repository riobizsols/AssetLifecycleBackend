# Backend only — Redis is shared via docker-compose.redis.yml (container alm_redis).
# One-time on server:
#   docker network create alm-shared
#   docker network connect alm-shared alm_db
#   docker compose -f docker-compose.redis.yml up -d   # if alm_redis does not exist yet
#
# Deploy backend:
#   ./deploy-docker.sh
#
# DATABASE_URL @alm_db and REDIS_URL @alm_redis require network alm-shared.
# MinIO (mansoor-minio) lives on external network mansoor-s-app-backend_mansoor-net.

services:
  alm-backend:
    container_name: alm-main-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    ports:
      - "5002:5000"
    restart: unless-stopped
    networks:
      - default
      - alm-shared
      - mansoor-net

networks:
  alm-shared:
    external: true
  mansoor-net:
    external: true
    name: mansoor-s-app-backend_mansoor-net
