version: "3.9"

# Pressana org stack — separate from alm-main (5002/3002) and alm-tenant (5001/3001).
# Host ports: backend 5003, frontend 3003 → https://pressanaorg.rioassetmanagement.net
#
# DATABASE_URL @alm_db requires network alm-shared with Postgres container alm_db.
# Redis: use shared alm_redis (do NOT define alm-redis here — conflicts with main ALM).
# MinIO: join mansoor-net so MINIO_END_POINT=mansoor-minio resolves.

services:
  alm-backend:
    container_name: alm-pressana-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    ports:
      - "5003:5001"
    restart: unless-stopped
    networks:
      - alm-shared
      - mansoor-net

networks:
  alm-shared:
    external: true
  mansoor-net:
    external: true
    name: mansoor-s-app-backend_mansoor-net
