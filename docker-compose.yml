# DATABASE_URL like postgres://...@alm_db:5432/db only works if this container
# shares a user-defined Docker network with the Postgres container named alm_db.
# One-time on server: docker network create alm-shared && docker network connect alm-shared alm_db
#
# Redis: use the shared alm_redis container on alm-shared (started by main ALM stack).
# Do NOT define alm-redis here — name conflicts with ~/alm-main on the same server.
# Set REDIS_URL=redis://alm_redis:6379/0 in .env.production
#
# DATABASE_URL @alm_db requires network alm-shared with Postgres container alm_db.
# Redis: use shared alm_redis (do NOT define alm-redis here — conflicts with main ALM).
# MinIO: join mansoor-net so MINIO_END_POINT=mansoor-minio resolves.

services:
  alm-backend:
    container_name: alm-tenant-backend
    build:
      context: .
      dockerfile: Dockerfile
    # Compose loads both; deploy syncs missing keys into .env.production first.
    # Later file wins on duplicate keys — keep secrets in .env.production.
    env_file:
      - .env
      - .env.production
    ports:
      - "5001:5001"
    restart: unless-stopped
    networks:
      - alm-shared
      - mansoor-net

networks:
  alm-shared:
    external: true
  mansoor-net:
    external: true
    name: mansoor-s-app-backend_mansoor-net
