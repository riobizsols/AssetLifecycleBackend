# Backend only — Redis is shared via docker-compose.redis.yml (container alm_redis).
# PgBouncer is shared via docker-compose.pgbouncer.yml (container alm_pgbouncer).
# One-time on server:
#   docker network create alm-shared
#   docker network connect alm-shared alm_db
#   docker compose -f docker-compose.redis.yml up -d
#   ./scripts/db/enable-pgbouncer-main.sh
#   docker compose -f docker-compose.pgbouncer.yml up -d
#
# Deploy backend:
#   ./deploy-docker.sh
#
# App traffic: DATABASE_URL → alm_pgbouncer:6432 (when PGBOUNCER_ENABLED=true)
# Admin/DDL:   POSTGRES_DIRECT_URL → alm_db:5432
# MinIO (mansoor-minio) lives on external network mansoor-s-app-backend_mansoor-net.

services:
  alm-backend:
    container_name: alm-main-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    ports:
      - "5002:5000"
    restart: unless-stopped
    networks:
      - default
      - alm-shared
      - mansoor-net

networks:
  alm-shared:
    external: true
  mansoor-net:
    external: true
    name: mansoor-s-app-backend_mansoor-net
