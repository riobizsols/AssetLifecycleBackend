# Bannari stack — separate from the existing ALM application stacks.
# Host ports: backend 5004, frontend 3004 → https://bannari.rioassetmanagement.net
#
# DATABASE_URL @alm_db requires network alm-shared with Postgres container alm_db.
# Redis: use shared alm_redis (do NOT define alm-redis here — conflicts with main ALM).
# MinIO: join mansoor-net so MINIO_END_POINT=mansoor-minio resolves.

services:
  alm-backend:
    container_name: alm-bannari-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    ports:
      - "5004:5001"
    restart: unless-stopped
    networks:
      - alm-shared
      - mansoor-net

networks:
  alm-shared:
    external: true
  mansoor-net:
    external: true
    name: mansoor-s-app-backend_mansoor-net
