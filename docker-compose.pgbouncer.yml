# Shared PgBouncer for ALM main stack (web.rioassetmanagement.net).
# Internal only — not published to host ports. Backend connects via alm_pgbouncer:6432.
#
# One-time / deploy:
#   node scripts/db/render-pgbouncer-config.js
#   docker compose -f docker-compose.pgbouncer.yml up -d
#
# Enable in app (.env.production):
#   ./scripts/db/enable-pgbouncer-main.sh
#   docker restart alm-main-backend

services:
  alm-pgbouncer:
    # Hub pgbouncer/pgbouncer has no 1.23.1 tag (stale repo, latest is 1.15.0).
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: alm_pgbouncer
    restart: unless-stopped
    command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./config/pgbouncer/generated/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/generated/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - alm-shared
    healthcheck:
      test: ["CMD-SHELL", "pgrep pgbouncer >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  alm-shared:
    external: true
